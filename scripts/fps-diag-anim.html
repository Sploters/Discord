<!doctype html>
<meta charset="utf-8">
<title>FPSDIAG-ANIM</title>
<style>html,body{margin:0;background:#000;overflow:hidden;cursor:none}canvas{display:block;width:100vw;height:100vh}</style>
<canvas id="c"></canvas>
<script>
// Conteúdo de teste para a captura de tela: TODO quadro muda (faixas rolando + formas), então qualquer queda de fps
// vem do pipeline de captura/codificação e não de uma tela parada. Conta os próprios quadros (verdade da fonte).
const c = document.getElementById('c'), x = c.getContext('2d', { alpha: false });
c.width = 1920; c.height = 1080;
window.__anim = { n: 0, t: performance.now() };
let hud = 0, last = performance.now(), shown = 0;
function frame(now) {
  const n = ++window.__anim.n, w = c.width, h = c.height;
  const off = (n * 14) % 160;
  for (let i = -1; i < w / 160 + 1; i++) { x.fillStyle = `hsl(${(i * 37 + n * 3) % 360} 70% ${i % 2 ? 35 : 55}%)`; x.fillRect(i * 160 + off, 0, 160, h); }
  for (let k = 0; k < 12; k++) {
    const px = (Math.sin(n / 40 + k) * .5 + .5) * (w - 140), py = (Math.cos(n / 55 + k * 1.7) * .5 + .5) * (h - 140);
    x.fillStyle = `hsl(${(k * 30 + n * 5) % 360} 90% 60%)`; x.fillRect(px, py, 140, 140);
  }
  for (let b = 0; b < 32; b++) { x.fillStyle = (n >>> b) & 1 ? '#fff' : '#000'; x.fillRect(b * 8, 0, 8, 8); } // número do quadro em binário (lido pelos spikes nativos)
  x.fillStyle = '#000'; x.fillRect(20, 20, 380, 90);
  x.fillStyle = '#fff'; x.font = '56px monospace'; x.fillText('frame ' + n, 36, 80);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
