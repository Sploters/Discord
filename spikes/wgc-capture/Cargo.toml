[package]
name = "wgc-capture-spike"
version = "0.1.0"
edition = "2021"
description = "Spike A: mede os FPS de captura do Windows Graphics Capture, sem codificação. Fora do produto."
publish = false

[dependencies]
windows = { version = "0.62", features = [
  "Foundation",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
] }

[profile.release]
opt-level = 3
